name: Deploy to OCI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A1(arm64) 전환 대비 멀티 아키텍처. Go 는 BUILDPLATFORM 에서 교차 컴파일한다
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # GitHub Container Registry (조직 패키지). 별도 계정 시크릿 없이 GITHUB_TOKEN 으로 push 한다
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=ajouevent-crawling
          cache-to: type=gha,scope=ajouevent-crawling,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/AjouEvent/AjouEvent_Crawling_V2
          tags: |
            ghcr.io/ajouevent/ajouevent-crawling:latest
            ghcr.io/ajouevent/ajouevent-crawling:${{ github.sha }}

      - name: Copy compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_DEPLOY_KEY }}
          source: docker-compose.yml
          target: /home/ubuntu/crawling

      - name: Deploy crawler
        uses: appleboy/ssh-action@v1.2.5
        env:
          CRAWLING_IMAGE: ghcr.io/ajouevent/ajouevent-crawling:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_DEPLOY_KEY }}
          command_timeout: 10m
          envs: CRAWLING_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /home/ubuntu/crawling
            if [ ! -f .env ]; then
              echo "/home/ubuntu/crawling/.env is required (render it from OCI Vault: ajouevent-crawling-env)"
              exit 1
            fi
            if ! docker plugin inspect loki >/dev/null 2>&1; then
              docker plugin install grafana/loki-docker-driver:3.7.2-$(dpkg --print-architecture) --alias loki --grant-all-permissions
            fi
            docker plugin enable loki >/dev/null 2>&1 || true
            export CRAWLING_IMAGE
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            docker compose pull crawling
            docker logout ghcr.io >/dev/null
            docker compose up -d
            docker image prune -f
